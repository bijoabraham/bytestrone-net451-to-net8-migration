# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: apply-namespaces
    name: Update MVC Namespaces
    type: automatic
    steps:
      - name: "Scan matching csharp files and apply namespace fixes"
        js-ast-grep:
          js_file: scripts/codemod-namespaces.ts
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"

  - id: apply-dbcontext
    name: Refactor DbContext for DI
    type: automatic
    steps:
      - name: "Scan matching csharp files and apply DbContext fixes"
        js-ast-grep:
          js_file: scripts/codemod-dbcontext.ts
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"

  - id: apply-razor
    name: Modernize Razor Form Tags
    type: automatic
    steps:
      - name: "Scan matching html files and apply Razor fixes"
        js-ast-grep:
          js_file: scripts/codemod-razor.ts
          base_path: "."
          language: "html"
          include:
            - "**/*.cshtml"
            - "**/*.html"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"

  - id: apply-program-cs
    name: Inject Program.cs and Remove Global.asax
    type: automatic
    steps:
      - name: "Scan Global.asax.cs to wipe legacy config and inject .NET 8 Program.cs"
        js-ast-grep:
          js_file: scripts/codemod-program-cs.ts
          base_path: "."
          language: "csharp"
          include:
            - "**/Global.asax.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"

  - id: apply-infrastructure
    name: Migrate Infrastructure Files (.csproj, appsettings.json)
    type: automatic
    steps:
      - name: "Rewrite .csproj, extract connection string to appsettings.json, delete legacy config"
        js-ast-grep:
          js_file: scripts/codemod-infrastructure.ts
          base_path: "."
          language: "html"
          include:
            - "**/Web.config"
            - "**/*.csproj"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"

  - id: apply-efcore
    name: Modernize Entity Framework 6 to EF Core 8
    type: automatic
    steps:
      - name: "Scan matching csharp files and replace EF6 syntax with EF Core 8"
        js-ast-grep:
          js_file: scripts/codemod-efcore.ts
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
